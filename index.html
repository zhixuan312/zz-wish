<title>One Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: a full-bleed 3D scene; one quiet sheet at the bottom carries each step. Single dark look by choice. */
:root {
  --night: #0b0806;
  --paper: #eee3d1;
  --dim: rgba(238, 227, 209, .66);
  --faint: rgba(238, 227, 209, .42);
  --line: rgba(238, 227, 209, .18);
  --ember: #e3a35b;
  --ember-ink: #1c1009;
  --veil: rgba(9, 7, 5, .9);
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--serif); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .9s ease; z-index: 5; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.brand { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font-size: 15px; letter-spacing: .3em; color: var(--dim); text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px calc(20px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--veil) 62%, rgba(9, 7, 5, 0)); }
.sheet.low { padding-top: 64px; background: linear-gradient(to top, rgba(9,7,5,.84) 50%, rgba(9, 7, 5, 0)); }
.inner { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .32em; color: var(--faint); }
h1, h2 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: .04em; }
h1 { font-size: 30px; }
h2 { font-size: 24px; }
.tname { font-size: 38px; font-weight: 700; letter-spacing: .22em; text-shadow: 0 2px 24px rgba(0,0,0,.55); }
p { margin: 0; font-size: 15px; line-height: 1.75; color: var(--dim); }
textarea { width: 100%; box-sizing: border-box; resize: none; min-height: 84px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(238, 227, 209, .05); color: var(--paper); font: 17px/1.6 var(--serif); }
textarea::placeholder { color: var(--faint); }
textarea:focus-visible, button:focus-visible, canvas:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.label { font-size: 13px; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 14px var(--serif); color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ember-ink); background: var(--ember); border-color: var(--ember); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn { font: 600 16px var(--serif); letter-spacing: .12em; padding: 13px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: rgba(9,7,5,.2); color: var(--paper); }
.btn.primary { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.small { font-size: 13px; padding: 8px 12px; letter-spacing: .06em; font-weight: 400; }
.places { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.places::-webkit-scrollbar { display: none; }
.place { flex: 0 0 auto; position: relative; font: 16px var(--serif); letter-spacing: .08em; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(9, 7, 5, .45); color: var(--dim); cursor: pointer; }
.place[aria-pressed="true"] { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); }
.place.rec::after { content: ''; position: absolute; top: 6px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--ember); }
.place.rec[aria-pressed="true"]::after { background: var(--ember-ink); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab { font: 15px var(--serif); letter-spacing: .1em; padding: 9px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; }
.tab[aria-selected="true"] { background: rgba(238, 227, 209, .14); color: var(--paper); }
.sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size { display: grid; gap: 3px; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--paper); cursor: pointer; font-family: var(--serif); }
.size b { font-size: 16px; font-weight: 600; letter-spacing: .1em; }
.size span { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.size[aria-pressed="true"] { border-color: var(--ember); background: rgba(227, 163, 91, .12); }
.draw { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
#pad { width: min(38vw, 168px); aspect-ratio: 2 / 3; border-radius: 10px; border: 1px dashed rgba(238, 227, 209, .32); background: rgba(238, 227, 209, .04); touch-action: none; cursor: crosshair; display: block; }
.drawSide { display: grid; gap: 10px; align-content: start; }
.padTime { white-space: nowrap; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.swatches { display: flex; gap: 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(9,7,5,.9); outline: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ember); outline-offset: 2px; }
.note { font-size: 13px; line-height: 1.65; color: var(--faint); }
/* Fixed heights so the pad never moves while someone is drawing. */
#padNote { min-height: calc(13px * 1.65 * 4); }
#candleNote { min-height: calc(13px * 1.65 * 3); }
.travel { position: absolute; inset: 0; display: grid; place-content: start center; padding-top: calc(15vh + env(safe-area-inset-top, 0px)); text-align: center; gap: 10px; pointer-events: none; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.travel .go { font-size: 13px; letter-spacing: .5em; color: var(--dim); }
.travel .big { font-size: 46px; font-weight: 700; letter-spacing: .3em; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.travel .where { font-size: 14px; letter-spacing: .3em; color: var(--dim); }
.travel > * { opacity: 0; transition: opacity 1.4s ease; }
.travel.on > * { opacity: 1; }
.skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); pointer-events: auto; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud .top { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; font-size: 13px; letter-spacing: .28em; color: var(--faint); }
.hud .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding-top: 70px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(9,7,5,.82) 55%, rgba(9,7,5,0)); display: grid; justify-items: center; gap: 8px; padding-inline: max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.hud .wish { font-size: 16px; line-height: 1.7; color: var(--dim); max-width: 30em; }
.hud .time { font-size: 40px; font-weight: 400; letter-spacing: .08em; font-variant-numeric: tabular-nums; color: var(--paper); }
.hud .hint { font-size: 12px; color: var(--faint); letter-spacing: .12em; }
.hud .ctl { display: flex; gap: 10px; pointer-events: auto; margin-top: 6px; }
.confirm { display: grid; gap: 10px; justify-items: center; pointer-events: auto; }
@media (min-width: 720px) { h1 { font-size: 36px; } .travel .big { font-size: 64px; } .tname { font-size: 48px; } }
@media (prefers-reduced-motion: reduce) { #fade, .travel > * { transition-duration: .2s; } }
</style>

<canvas id="gl" aria-label="寺庙"></canvas>
<div id="fade"></div>
<div id="ui">
  <div class="brand" id="brand">一盏</div>

  <section class="sheet" id="pWish" hidden>
    <div class="inner">
      <div class="eyebrow">第一步</div>
      <h1>先许一个愿</h1>
      <p>写下你为什么点这一盏。只有你看得到。</p>
      <textarea id="wish" maxlength="60" rows="2" placeholder="比如：这次考试，稳稳地发挥出来。" aria-label="你的愿望"></textarea>
      <div class="label">大概是为了</div>
      <div class="chips" id="cats"></div>
      <button class="btn primary" id="toTemple" disabled>许好了</button>
    </div>
  </section>

  <section class="sheet low" id="pTemple" hidden>
    <div class="inner">
      <div class="eyebrow">第二步 · 供在哪里</div>
      <div class="tname" id="placeName" aria-live="polite"></div>
      <div class="places" id="places" role="list"></div>
      <div class="row">
        <button class="btn" id="backWish">改愿望</button>
        <button class="btn primary" id="go">去这里</button>
      </div>
    </div>
  </section>

  <div class="travel" id="travel" hidden>
    <div class="go">前往</div>
    <div class="big" id="tName"></div>
    <div class="where" id="tWhere"></div>
  </div>
  <button class="btn small skip" id="skip" hidden>跳过</button>

  <section class="sheet" id="pCandle" hidden>
    <div class="inner">
      <div class="eyebrow">第三步</div>
      <h2 id="candleTitle">选一支烛</h2>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabPick" aria-selected="true">我们备的</button>
        <button class="tab" role="tab" id="tabDraw" aria-selected="false">自己画</button>
      </div>
      <div id="pickPane"><div class="sizes" id="sizes"></div></div>
      <div id="drawPane" hidden>
        <div class="draw">
          <canvas id="pad" aria-label="画你的烛：画出它的样子"></canvas>
          <div class="drawSide">
            <div class="padTime" id="padTime">—</div>
            <p class="note" id="padNote">画出烛的样子。画得细，烧得快；画得粗，烧得久。</p>
            <div class="swatches" id="swatches"></div>
            <div><button class="btn small" id="padClear">重画</button></div>
          </div>
        </div>
      </div>
      <p class="note" id="candleNote"></p>
      <div class="row">
        <button class="btn" id="backTemple">换个地方</button>
        <button class="btn primary" id="place">供上</button>
      </div>
    </div>
  </section>

  <section class="sheet" id="pOffer" hidden>
    <div class="inner">
      <h2>已经供上了</h2>
      <p id="offerLead"></p>
      <button class="btn primary" id="light">点燃</button>
    </div>
  </section>

  <div class="hud" id="hud" hidden>
    <div class="top" id="hudTop"></div>
    <div class="bottom">
      <div class="wish" id="hudWish"></div>
      <div class="time" id="hudTime">00:00</div>
      <div class="hint" id="hudHint">还要烧</div>
      <div class="ctl" id="hudCtl">
        <button class="btn small" id="fast" aria-pressed="false">加速看看</button>
        <button class="btn small" id="stop">熄灭</button>
      </div>
      <div class="confirm" id="confirm" hidden>
        <p>确定熄灭？这一盏会停在这里。</p>
        <div class="row"><button class="btn small" id="stopYes">熄灭</button><button class="btn small" id="stopNo">继续烧</button></div>
      </div>
    </div>
  </div>

  <section class="sheet" id="pOut" hidden>
    <div class="inner">
      <h2 id="outTitle">烛灭了</h2>
      <p id="outLead"></p>
      <div class="row">
        <button class="btn" id="later">改日再来</button>
        <button class="btn primary" id="relight">重新点燃</button>
      </div>
    </div>
  </section>

  <section class="sheet" id="pDone" hidden>
    <div class="inner">
      <h2>烧完了</h2>
      <p id="doneLead"></p>
      <button class="btn primary" id="again">再许一个愿</button>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- Content ----------
// Ten temples of different kinds. `asks` uses the wish categories; `lamp` is what is offered there.
const TEMPLES = [
  { id: 'lingyin', name: '灵隐寺', place: '杭州', asks: ['心安', '平安'], plaque: '大雄宝殿', lacquer: 0x6e1a12, lamp: 'candle' },
  { id: 'shaolin', name: '少林寺', place: '登封 · 嵩山', asks: ['健康', '事业'], plaque: '大雄宝殿', lacquer: 0x5e1a14, lamp: 'candle' },
  { id: 'yonghe', name: '雍和宫', place: '北京', asks: ['事业', '学业', '平安'], plaque: '雍和宫', lacquer: 0x7a1a10, lamp: 'candle' },
  { id: 'jokhang', name: '大昭寺', place: '拉萨', asks: ['心安', '家人', '健康'], plaque: null, lacquer: 0x4a1612, lamp: 'butter' },
  { id: 'puji', name: '普济寺', place: '普陀山', asks: ['家人', '平安', '健康'], plaque: '大圆通殿', lacquer: 0x6a1c14, lamp: 'candle' },
  { id: 'zixiao', name: '紫霄宫', place: '武当山', asks: ['健康', '心安'], plaque: '紫霄殿', lacquer: 0x5a1812, lamp: 'candle' },
  { id: 'qufu', name: '孔庙', place: '曲阜', asks: ['学业'], plaque: '大成殿', lacquer: 0x6a1810, lamp: 'candle' },
  { id: 'meizhou', name: '妈祖祖庙', place: '湄洲岛', asks: ['平安', '家人'], plaque: '湄洲祖庙', lacquer: 0x7a1c12, lamp: 'candle' },
  { id: 'guandi', name: '关帝庙', place: '解州', asks: ['事业'], plaque: '崇宁殿', lacquer: 0x681a12, lamp: 'candle' },
  { id: 'hongluo', name: '红螺寺', place: '怀柔 · 红螺山', asks: ['姻缘', '平安'], plaque: '大雄宝殿', lacquer: 0x701b12, lamp: 'candle' },
];
const CATS = ['学业', '事业', '姻缘', '健康', '家人', '平安', '心安'];

// Burn model. Every constant says where it comes from.
const BURN = {
  rate: 7.78,          // g/h for one wick. Measured standard: the 1860 "standard candle" burned 120 grains (7.78 g) of wax an hour.
  density: .9,         // g/cm3. Material property of solid paraffin (about 0.88 to 0.92).
  reach: .04,          // m. Candle makers' rule of thumb: one wick melts a pool about 8 cm across; wax farther out tunnels and is not burned. Not tested here.
  speed: 5,            // Game rule (owner): time here runs five times faster than for the real candle.
  butterDensity: .91,  // g/cm3. Material property of butter fat.
  butterRate: 7.78,    // g/h. Assumption: a butter-lamp wick burns fat at the candle rate. Not tested.
  minR: .004,          // m. Rule: a drawn line becomes at least an 8 mm candle, so a wick fits.
  pad: { w: .10, h: .15 }, // m. Rule: the drawing pad is a real 10 x 15 cm.
};
// Candles we offer, as [height, radius] in metres from the base up.
const CANDLES = [
  { name: '细烛', color: 0x8f1b12, prof: [[0, .0075], [.004, .0078], [.012, .0075], [.14, .0062], [.15, .0058]] },
  { name: '红烛', color: 0x9a1a10, prof: [[0, .0128], [.005, .0125], [.009, .0113], [.16, .0108]] },
  { name: '柱烛', color: 0xe6dcc6, prof: [[0, .02], [.096, .02], [.1, .0192]] },
];
const LAMPS = [{ name: '小盏', cup: .5 }, { name: '中盏', cup: .6 }, { name: '大盏', cup: .72 }];
const WAXES = [{ name: '朱红', color: 0x8f1b12 }, { name: '象牙', color: 0xe6dcc6 }, { name: '蜂蜡', color: 0xc8922e }];

// ---------- Renderer ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 900);
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(new THREE.Scene(), camera);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.5, 0.9);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 p = (vUv - .5) * vec2(1., 1.12);
      float v = 1. - smoothstep(.3, .9, length(p)); c.rgb *= mix(.55, 1., v);
      float n = fract(sin(dot(vUv * 913.7 + uTime, vec2(12.9898, 78.233))) * 43758.5453) - .5;
      c.rgb += n * .02; gl_FragColor = c; }`,
});
composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(new OutputPass()); composer.addPass(grade);

// ---------- Helpers ----------
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seedOf = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7);
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const wobble = (t, s) => Math.sin(t * 1.7 + s) * .5 + Math.sin(t * 3.1 + s * 2.3) * .3 + Math.sin(t * 7.3 + s * .7) * .2;
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const SERIF = '"Noto Serif SC", "Songti SC", "STSong", serif';

const softTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const petalTex = canvasTex(32, 32, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.ellipse(16, 16, 13, 7, .6, 0, Math.PI * 2); g.fill(); });
function stoneTex(seed, base = [24, 9, 15]) {
  const rnd = mulberry32(seed);
  const t = canvasTex(1024, 1024, (g, w, h) => {
    const n = 4, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const l = base[2] + rnd() * 6; g.fillStyle = `hsl(${base[0]} ${base[1]}% ${l}%)`; g.fillRect(i * s, j * s, s, s);
      for (let k = 0; k < 900; k++) { g.fillStyle = `rgba(${rnd() < .5 ? '255,240,220' : '0,0,0'},${rnd() * .06})`; g.fillRect(i * s + rnd() * s, j * s + rnd() * s, 2 + rnd() * 5, 2 + rnd() * 5); }
    }
    g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 5;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const pavingTex = stoneTex(7, [30, 6, 46]);
const grainTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = mulberry32(11); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(60,20,10,${.04 + rnd() * .08})`; g.lineWidth = 1 + rnd() * 3; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rnd() * 20 - 10, w * .7, y + rnd() * 20 - 10, w, y + rnd() * 10 - 5); g.stroke(); }

function waxMaterial(color, o = {}) {

// Flame: a camera-facing quad that stays upright, drawn by a shader (blue base, hot core, orange skirt).
const flameVS = `
uniform float uScale; uniform float uSeedU;
#ifdef USE_INSTANCING
attribute float aSeed; attribute float aScale;
#endif
varying vec2 vUv; varying float vSeed;
void main(){
  vUv = uv; float sc = uScale; float sd = uSeedU; vec4 c = modelMatrix * vec4(0., 0., 0., 1.);
  #ifdef USE_INSTANCING
  sc = aScale; sd = aSeed; c = modelMatrix * instanceMatrix * vec4(0., 0., 0., 1.);
  #endif
  vSeed = sd;
  vec3 r = normalize(vec3(viewMatrix[0][0], 0., viewMatrix[2][0]));
  vec3 wp = c.xyz + r * position.x * sc * .5 + vec3(0., 1., 0.) * (position.y + .5) * sc;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.);
}`;
const flameFS = `
uniform float uTime; uniform float uPower;
varying vec2 vUv; varying float vSeed;
float h1(float n){ return fract(sin(n) * 43758.5453); }
float vn(vec2 x){ vec2 p = floor(x), f = fract(x); f = f * f * (3. - 2. * f); float n = p.x + p.y * 57.;
  return mix(mix(h1(n), h1(n + 1.), f.x), mix(h1(n + 57.), h1(n + 58.), f.x), f.y); }
void main(){
  float t = uTime + vSeed * 17.;
  float y = vUv.y; float x = (vUv.x - .5) * 2.;
  float sway = (vn(vec2(t * 1.1, vSeed * 9.)) - .5) * .32 + (vn(vec2(t * 5.3, vSeed * 3.)) - .5) * .1;
  x -= sway * pow(y, 1.6);

  float py = (y - .26) / stretch; float up = max(py, 0.);
  float wid = .4 * max(1. - up * 1.08, .02);
  vec2 q = vec2(x / wid, py > 0. ? py / .66 : py / .2);
  float d = length(q);
  float a = 1. - smoothstep(.5, 1., d);
  vec2 qc = vec2(x / (wid * .5), py > 0. ? (py + .02) / .4 : py / .12);
  float core = 1. - smoothstep(.15, 1., length(qc));
  float blue = (1. - smoothstep(-.2, .04, py)) * smoothstep(.1, .8, abs(x) / .4 + .25);

// Smoke: recycled soft sprites. `k` scales speed for outdoor sizes.
class Smoke {
  constructor(scene, n, color, maxOp, k = 1) {
    this.parts = []; this.maxOp = maxOp; this.k = k; this.rnd = mulberry32(n * 7);
    for (let i = 0; i < n; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color, transparent: true, depthWrite: false, opacity: 0, fog: true }));
      s.visible = false; scene.add(s); this.parts.push({ s, age: 0, life: 0, v: V3(0, 0, 0), seed: this.rnd() * 10 });
    }
  }
  puff(pos, spread = .002, size = .02) {
    const p = this.parts.find((q) => !q.s.visible); if (!p) return;
    const k = this.k;
    p.s.visible = true; p.age = 0; p.life = 2.6 + this.rnd() * 2; p.size = size;
    p.s.position.copy(pos).add(V3((this.rnd() - .5) * spread, 0, (this.rnd() - .5) * spread));
    p.v.set((this.rnd() - .5) * .01 * k, (.05 + this.rnd() * .04) * k, (this.rnd() - .5) * .01 * k);
  }
  update(dt, time) {
    for (const p of this.parts) {
      if (!p.s.visible) continue;
      p.age += dt; if (p.age > p.life) { p.s.visible = false; continue; }
      const k = p.age / p.life;
      p.v.x += Math.sin(time * 1.3 + p.seed + p.age * 2.1) * .006 * dt * this.k; p.v.z += Math.cos(time * .9 + p.seed) * .004 * dt * this.k;
      p.s.position.addScaledVector(p.v, dt);
      const sc = p.size * (1 + k * 5); p.s.scale.set(sc, sc * 1.6, 1);
      p.s.material.opacity = this.maxOp * Math.sin(Math.PI * Math.min(1, k * 1.4)) * (1 - k);
    }
  }
}

// ---------- The person's offering ----------
const PLATE_H = .046; // a short brass candlestick (.04) and its dish (.006)
// Resample a [height, radius] profile into rows every 2 mm.
function resample(prof, step = .002) {
  const top = prof[prof.length - 1][0], rows = [];
  const at = (y) => { let i = 1; while (i < prof.length - 1 && prof[i][0] < y) i++; const [y0, r0] = prof[i - 1], [y1, r1] = prof[i]; const k = Math.min(1, Math.max(0, (y - y0) / (y1 - y0 || 1))); return { y, cx: 0, r: r0 + (r1 - r0) * k }; };
  for (let y = 0; y < top - 1e-6; y += step) rows.push(at(y));
  rows.push(at(top)); return rows;
}
// Wax mass from the base up, the real burn time, and the time here.
function burnOf(rows) {
  const cum = [0]; let g = 0;
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i], ra = Math.min(a.r, BURN.reach), rb = Math.min(b.r, BURN.reach);
    g += Math.PI * (b.y - a.y) * (ra * ra + ra * rb + rb * rb) / 3 * 1e6 * BURN.density; cum.push(g);
  }
  const hours = g / BURN.rate;
  return { grams: g, hours, ms: hours * 3600e3 / BURN.speed, cum, tunnel: rows.some((q) => q.r > BURN.reach) };
}
const CUP = { y0: .072, y1: .114 };
const cupR = (y) => Math.min(.028 + .022 * (y - .072) / .032, .052);
function butterOf(s) {
  const n = 40, ys = [CUP.y0], cum = [0], dy = (CUP.y1 - CUP.y0) / n; let v = 0;
  for (let i = 1; i <= n; i++) { const y = CUP.y0 + dy * i, r = cupR(y - dy / 2); v += Math.PI * r * r * dy; ys.push(y); cum.push(v); }
  const grams = v * s ** 3 * 1e6 * BURN.butterDensity, hours = grams / BURN.butterRate;

  }
  pg.strokeStyle = '#eee3d1'; pg.lineWidth = 2.2 * dpr; pg.lineCap = pg.lineJoin = 'round';
  for (const s of strokes) { pg.beginPath(); s.forEach((p, i) => i ? pg.lineTo(p.x * W, p.y * H) : pg.moveTo(p.x * W, p.y * H)); if (s.length === 1) pg.lineTo(s[0].x * W + .5, s[0].y * H); pg.stroke(); }
  if (!strokes.length) { pg.fillStyle = 'rgba(238,227,209,.42)'; pg.font = `${14 * dpr}px ${SERIF}`; pg.textAlign = 'center'; pg.fillText('在这里画', W / 2, H / 2); pg.font = `${11 * dpr}px ${SERIF}`; pg.fillText('10 × 15 厘米', W / 2, H / 2 + 20 * dpr); }
}
window.addEventListener('resize', () => { if (!$('drawPane').hidden) sizePad(); });

// Lighting and burning.
let wakeLock = null;
async function lightUp() {
  show(null);
  if (!S.total) { S.total = S.offer.burn.ms; S.left = S.total; S.burned = 0; }
  await tween(1.6, (k) => { mine.power = ease(k); });
  S.burning = true; $('hudTime').textContent = lastShown = fmtClock(S.left);
  $('hudTop').textContent = `${S.temple.name} · ${S.temple.place}`;
  $('hudWish').textContent = `「${S.wish}」`;
  $('confirm').hidden = true; $('hudCtl').hidden = false; $('hud').hidden = false;
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; }
}
$('light').onclick = lightUp;
$('relight').onclick = lightUp;
$('fast').onclick = () => { S.speed = S.speed === 1 ? 120 : 1; $('fast').setAttribute('aria-pressed', String(S.speed > 1)); $('fast').textContent = S.speed > 1 ? '演示 ×120 · 恢复' : '加速看看'; };
$('stop').onclick = () => { $('hudCtl').hidden = true; $('confirm').hidden = false; };
$('stopNo').onclick = () => { $('hudCtl').hidden = false; $('confirm').hidden = true; };
$('stopYes').onclick = () => goOut('你熄灭了它');

const wickSmoke = new Smoke(hall, 70, 0xcfc8c0, .2);
let smokeUntil = 0;
async function snuff() {
  S.burning = false; $('hud').hidden = true;
  try { await wakeLock?.release(); } catch { /* already released */ }
  smokeUntil = clockTime + 4;
  await tween(.7, (k) => { mine.power = 1 - k; });
  mine.power = 0;
}
async function goOut(reason) {
  if (!S.burning) return;
  await snuff();
  $('outTitle').textContent = `${fire()}灭了`;
  $('outLead').textContent = `${reason}。它为你的愿烧了 ${fmtSpan(S.burned)}，还剩 ${fmtSpan(S.left)}。重新点燃，就从这里接着烧。`;
  setTimeout(() => show('pOut'), 900);
}
async function finish() {
  await snuff();
  $('doneLead').textContent = `在${S.temple.name}，这一${S.offer.kind === 'butter' ? '盏' : '支'}为「${S.wish}」烧完了，一共 ${fmtSpan(S.total)}。`;
  setTimeout(() => show('pDone'), 1400);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) goOut('你离开了这一页'); });
window.addEventListener('pagehide', () => goOut('你离开了这一页'));
function restart() {
  S.total = 0; S.left = 0; S.burned = 0; S.speed = 1; $('fast').setAttribute('aria-pressed', 'false'); $('fast').textContent = '加速看看';
  $('wish').value = ''; $('toTemple').disabled = true; S.cat = null; document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', 'false'));
  strokes = []; S.drawn = null; S.outline = null; mine.power = 0; setOffer(null);
  show('pWish'); moveCam(WIDE.pos, WIDE.look, 3);
}
$('later').onclick = restart;
$('again').onclick = restart;

// ---------- Frame loop ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w / h < .8 ? 44 : 32; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let clockTime = 0, lastShown = '';
const tmp = V3(0, 0, 0);
function frame() {
  const dt = Math.min(clock.getDelta(), .05); clockTime += dt; const time = clockTime;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = tw.skip ? 1 : Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  if (S.burning) {
    const step = dt * 1000 * S.speed; S.left = Math.max(0, S.left - step); S.burned += step;
    const shown = fmtClock(S.left); if (shown !== lastShown) { $('hudTime').textContent = shown; lastShown = shown; }
    if (S.left <= 0) finish();
  }
  if (active === hall) {
    if (S.total) mine.setLevel(S.left / S.total);
    for (const m of flameMats) m.uniforms.uTime.value = time;
    const topY = ALTAR_Y + mine.top.y;
    mine.update(time, topY);
    for (const o of others) { o.f.tick(time, 1, .3, o.wax, o.g.position.y + o.f.flame.position.y); }
    if (time < smokeUntil && Math.random() < .7) wickSmoke.puff(tmp.set(mine.top.x, topY, mine.g.position.z), .002, .012);
    wickSmoke.update(dt, time);
    if (Math.random() < .5) incenseSmoke.puff(incenseTips[Math.floor(Math.random() * 3)], .001, .01);
    incenseSmoke.update(dt, time);
    const dp = dust.geometry.attributes.position;
    for (let i = 0; i < dp.count; i++) { let y = dp.getY(i) + dt * .02; if (y > 3.8) y = .4; dp.setY(i, y); dp.setX(i, dp.getX(i) + Math.sin(time * .3 + i) * dt * .004); }
    dp.needsUpdate = true;
    banners.forEach((b, i) => { b.rotation.z = Math.sin(time * .4 + i * 2) * .012; });
  } else if (place) {
    for (const f of place.up) f(dt, time);
  }
  // A slow drift so the view breathes like a held camera; wider outside.
  const a = rig.amp;
  camera.position.copy(rig.pos).add(tmp.set(Math.sin(time * .13) * a, Math.sin(time * .09) * a * .35, Math.cos(time * .11) * a * .5));
  camera.lookAt(rig.look);
  if (place) place.sky.position.copy(camera.position);
  renderPass.scene = active;
  grade.uniforms.uTime.value = time % 10;
  composer.render();
  requestAnimationFrame(frame);
}

// ---------- Start ----------
(async () => {
  try { await Promise.race([document.fonts.load(`700 80px ${SERIF}`, '大雄宝殿灵隐寺'), new Promise((r) => setTimeout(r, 2500))]); } catch { /* fallback serif */ }
  applyTemple(TEMPLES[0]); switchTo(hall);
  rig.pos.copy(WIDE.pos); rig.look.copy(WIDE.look);
  frame();
  show('pWish');
  await fadeTo(0, 1600);
})();
</script>
